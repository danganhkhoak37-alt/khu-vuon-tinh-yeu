<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khu Vườn Tình Yêu - Thúy Nhi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020111;
            color: white;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            /* Ngăn chặn các hành động mặc định của trình duyệt di động để tránh lag */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #20124d 0%, #05050a 100%);
        }

        .main-header {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .main-header h1 {
            font-size: 2.2rem; /* Giảm size một chút để vừa màn hình dọc điện thoại */
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #ff99cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 153, 204, 0.8));
        }

        .wish-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 14px;
            color: white;
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
            animation: popInMobile 0.4s ease-out forwards, fadeOutMobile 2s 2.5s ease-in forwards;
            z-index: 200;
            white-space: normal; /* Cho phép xuống dòng trên màn hình hẹp */
            max-width: 200px;
            text-align: center;
        }

        @keyframes popInMobile {
            0% { transform: translate(-50%, 0) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50px) scale(1); opacity: 1; }
        }

        @keyframes fadeOutMobile {
            to { opacity: 0; transform: translate(-50%, -80px); }
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="main-header">
            <h1 id="title">TẶNG THÚY NHI ❤️</h1>
            <p style="font-size: 0.9rem; opacity: 0.7;">Chạm vào hoa để xem điều ước</p>
        </div>
        <canvas id="gardenCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('gardenCanvas');
const ctx = canvas.getContext('2d');

// Thiết lập kích thước canvas chuẩn cho cả Retina display trên iPhone
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

const wishes = [
    "Thúy Nhi luôn xinh đẹp như hoa nhé! 🌸",
    "Chúc Nhi ngày nào cũng cười thật tươi! ✨",
    "Yêu Thúy Nhi nhất trên đời! ❤️",
    "Mọi điều may mắn sẽ đến với em! 🍀",
    "Đừng lo, luôn có anh bên cạnh Nhi! 🥰",
    "Em là bông hoa rực rỡ nhất! 🌹",
    "Mong Nhi luôn bình yên và hạnh phúc! 🌻"
];

/* ------------------ HOA & PHÁO HOA (Logic cũ đã tối ưu) ------------------ */
const flowers = [];
const types = ['🌸','🌹','🌺','🌷','🌻','🌼'];
for(let i=0; i<100; i++) {
    flowers.push({
        x: Math.random()*window.innerWidth,
        y: window.innerHeight - (Math.random()*window.innerHeight*0.35),
        size: Math.random()*25+25,
        type: types[Math.floor(Math.random()*types.length)],
        z: Math.random() * 0.7 + 0.3,
        sway: Math.random()*0.02,
        offset: Math.random() * 100
    });
}

function draw() {
    ctx.fillStyle = "rgba(2,1,17,0.3)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Vẽ hoa
    flowers.sort((a,b) => a.z - b.z);
    flowers.forEach(f => {
        let currentX = f.x + Math.sin(Date.now()*f.sway + f.offset)*5;
        ctx.globalAlpha = f.z;
        ctx.font = `${f.size * f.z}px Arial`;
        ctx.fillText(f.type, currentX, f.y);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
}
draw();

/* ------------------ TỐI ƯU CHẠM (TOUCH) ------------------ */

function handleInteraction(e) {
    // Lấy tọa độ bất kể là chuột hay chạm tay
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    if (!clientX || !clientY) return;

    flowers.forEach(f => {
        let dist = Math.sqrt((clientX - f.x)**2 + (clientY - f.y)**2);
        // Tăng vùng chạm (hitbox) lên một chút để dễ bấm trên điện thoại
        if(dist < f.size * 1.5) {
            createWish(clientX, clientY);
        }
    });
}

function createWish(x, y) {
    // Xóa bớt các bubble cũ nếu quá nhiều để tránh nặng máy
    const oldBubbles = document.querySelectorAll('.wish-bubble');
    if(oldBubbles.length > 5) oldBubbles[0].remove();

    const bubble = document.createElement('div');
    bubble.className = 'wish-bubble';
    bubble.style.left = x + 'px';
    bubble.style.top = y + 'px';
    bubble.innerText = wishes[Math.floor(Math.random() * wishes.length)];
    document.body.appendChild(bubble);

    setTimeout(() => bubble.remove(), 4500);
}

// Lắng nghe cả chuột và chạm tay
canvas.addEventListener('mousedown', handleInteraction);
canvas.addEventListener('touchstart', (e) => {
    // Ngăn chặn phóng to hay cuộn trang khi đang tương tác với hoa
    if (e.cancelable) e.preventDefault();
    handleInteraction(e);
}, { passive: false });

</script>
</body>
</html>
